[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests (no HTTP, no DB)",
    "api: API/integration tests through FastAPI TestClient",
    "regression: baseline regression suite for critical behaviours",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
