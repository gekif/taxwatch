name: CI
on:
  push: { branches: [Main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: taxwatch, POSTGRES_PASSWORD: taxwatch, POSTGRES_DB: taxwatch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxwatch" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - name: Unit + API + regression tests (coverage gate)
        run: python -m pytest --cov --cov-fail-under=90
      - name: Migrations + E2E smoke test on real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://taxwatch:taxwatch@localhost:5432/taxwatch
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m uvicorn app.main:app --port 8000 &
          sleep 4
          cd .. && python -m scripts.smoke_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend deps and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright E2E (starts backend + frontend automatically)
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
