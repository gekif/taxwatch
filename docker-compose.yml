services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taxwatch
      POSTGRES_PASSWORD: taxwatch
      POSTGRES_DB: taxwatch
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://taxwatch:taxwatch@db:5432/taxwatch
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random chars) in your shell or .env}
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: "true"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
